# Supplementary inferCNV: R 4.3, Bioconductor 3.19 (inferCNV 1.20.0), Seurat 5.
# Versions follow snrnaseq/supplementary_infercnv/sessionInfo/. Difference from the original run:
#   R 4.4.0 -> R 4.3. inferCNV 1.20.0 itself is unchanged, but bioconda built it on R 4.3
#   against Bioconductor 3.18 infrastructure, so its Bioconductor dependencies are one release
#   older (e.g. SingleCellExperiment 1.24, limma 3.58, edgeR 4.0; originally 1.26, 3.60, 4.2).
name: infercnv
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - r-base=4.3
  - pandoc
  - jags
  # CRAN
  - r-yaml==2.3.9
  - r-rmarkdown==2.27
  - r-knitr==1.48
  - r-dplyr==1.1.4
  - r-ggplot2==3.5.1
  - r-seurat==5.1.0
  - r-seuratobject==5.0.2
  - r-igraph==2.0.3
  - r-rjags==4_15
  - r-argparse==2.2.3
  # Bioconductor (versions of the dependencies come from the lock file)
  - bioconductor-infercnv==1.20.0
  # Dependencies pinned to the versions in sessionInfo/. Not pinnable on R 4.3 conda builds:
  # the Bioconductor infrastructure (see above), and cluster, KernSmooth, MASS, Matrix, RcppParallel,
  # spatstat.explore, stringi, survival (the recorded versions need R 4.4 or have no build).
