# Stages 1-2 (and later 4-5): R 4.3, Bioconductor 3.17, Seurat 4.
# Versions follow snrnaseq/stage*/sessionInfo/. Differences from the original runs:
#   Stage 2 originally ran R 4.4.0 with Matrix 1.7-5; here R 4.3 with the Stage 1 Matrix
#   glmGamPoi 1.12.1 -> 1.12.2 (bioconda only has the later patch)
# simspec is not on conda; it is installed from GitHub by envs/post_install.R.
name: snrnaseq
channels:
  - conda-forge
  - bioconda
  - nodefaults
