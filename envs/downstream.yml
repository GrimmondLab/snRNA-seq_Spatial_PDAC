# Stage 3 (malignant / non-malignant): R 4.3, Bioconductor 3.17, Seurat 4, ggplot2 3.5.2.
# Separate from snrnaseq because the original runs used newer plotting packages (ggplot2 3.5.2,
# patchwork 1.3.2, scales 1.4.0 vs 3.4.2, 1.1.2, 1.3.0) and added edgeR / clusterProfiler / msigdbr.
# Versions follow snrnaseq/stage3_malignant_nonmalignant/sessionInfo/. Differences from the original runs:
#   R 4.3.0 -> 4.3.x (conda's R 4.3 builds)
#   packages with no R 4.3 conda build of the recorded version use the nearest one (marked below)
#   workflowr (and git2r, getPass, whisker), renv, BiocManager: attached in the original session
#   but not used by the code, so left out
# simspec and treeio 1.25.0.001 are not on conda at these versions; installed from GitHub by
# envs/post_install_downstream.R.
name: downstream
channels:
  - conda-forge
  - bioconda
  - nodefaults
