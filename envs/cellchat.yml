# Stage 5 (CellChat): R 4.3, Bioconductor 3.17, Seurat 4, CellChat 2.1.2, dplyr 1.2.1.
# Separate from downstream because the original run used dplyr 1.2.1 (downstream: 1.1.2) and needs the
# CellChat dependencies. Versions follow snrnaseq/stage5_cellchat/sessionInfo/. Differences from the original run:
#   R 4.3.0 -> 4.3.x (conda's R 4.3 builds)
#   packages with no R 4.3 conda build of the recorded version use the nearest one (marked below)
#   workflowr (and git2r, getPass, whisker), renv: attached in the original session but not used by the code, so left out
# envs/post_install_cellchat.R installs these from source, because conda has no R 4.3 build of them:
#   cli 3.6.6, rlang 1.3.0, lifecycle 1.0.5, vctrs 0.7.3, tidyr 1.3.2 and dplyr 1.2.1 (CRAN; dplyr 1.2.1 needs the
#   newer rlang, vctrs and lifecycle), NMF 0.27 (CRAN; CellChat needs NMF >= 0.23), CellChat 2.1.2 (GitHub).
name: cellchat
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - r-base=4.3
  - pandoc
  # Packages the Rmd loads
  - r-yaml==2.3.7
