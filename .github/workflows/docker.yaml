name: docker

# Builds the analysis image from Dockerfile + the committed lock files in envs/,
# smoke-tests it, and pushes it to ghcr.io. Runs only on a pushed tag vX.Y.Z,
# which publishes :X.Y.Z, plus an Apptainer image converted from the same build
# and pushed with ORAS to the same package as :X.Y.Z-sif.
#
# Adapted from tidywf/actions dockerise.yaml, which can't be called as is:
# it builds amd64 + arm64 (bioconda's R 4.3 builds here are linux-64 only) and
# downloads lock files from release assets (here they are committed in envs/).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  LOCAL_IMG: pdac-snrnaseq:ci

jobs:
  docker:
    name: build, test, push
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      # The image takes ~12 GB in the daemon, on a 72 GB disk that also holds /mnt.
      # The runner's preinstalled toolchains are not needed.
      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/share/swift /usr/lib/jvm /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          df -h /
      - name: 🚚 Codeout
        id: codeout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docker driver: the image is built straight into the local daemon, so it
      # can be tested and then pushed without storing a second copy
      - name: 🏯 Buildx setup
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      # Lowercases the image name and generates tags + OCI labels. Defaults
      # (title, url, source, created) come from the GitHub repo.
      - name: 🏷️ Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.description=PDAC snRNA-seq analysis: R 4.3 conda envs (snrnaseq, downstream, cellchat, infercnv) and run.sh
            org.opencontainers.image.revision=${{ steps.codeout.outputs.commit }}
      - name: 🐳 Docker img build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ env.LOCAL_IMG }}
            ${{ steps.meta.outputs.tags }}
          push: false
      - name: 🧪 Smoke test
        run: |
          set -euo pipefail
          docker image ls "${LOCAL_IMG}"
          # Runner prints usage and exits 0; an unknown stage fails
          docker run --rm "${LOCAL_IMG}"
          if docker run --rm "${LOCAL_IMG}" stage9; then
            echo "run.sh accepted an unknown stage" >&2; exit 1
          fi
          # Key versions recorded at build time (envs/session_info.R)
          mkdir -p sessionInfo
          for env in snrnaseq downstream cellchat infercnv; do
            docker run --rm --entrypoint cat "${LOCAL_IMG}" "/pipeline/sessionInfo/${env}.txt" > "sessionInfo/${env}.txt"
          done
          check() { grep -q -- "$2" "sessionInfo/$1.txt" || { echo "$1: missing $2" >&2; exit 1; }; }
          for env in snrnaseq downstream cellchat infercnv; do check "${env}" "R version 4.3"; done
          for p in Seurat_4.3.0 SeuratObject_4.1.3 scDblFinder_1.14.0 scran_1.28.1 Matrix_1.5-4.1 simspec_ glmGamPoi_1.12.2; do
            check snrnaseq "${p}"
          done
          for p in Seurat_4.3.0 ggplot2_3.5.2 patchwork_1.3.2 edgeR_3.42.4 clusterProfiler_4.8.1 msigdbr_7.5.1 simspec_ treeio_1.25.0.001 schex_1.14.0 UCell_2.4.0 SingleR_2.2.0 EnhancedVolcano_1.18.0 ReactomePA_1.44.0; do
            check downstream "${p}"
          done
          for p in CellChat_2.1.2 dplyr_1.2.1 Seurat_4.3.0 ggplot2_3.5.2 NMF_0.27 presto_1.0.0; do
            check cellchat "${p}"
          done
          for p in infercnv_1.20.0 Seurat_5.1.0 SeuratObject_5.0.2 rjags_4-15; do
            check infercnv "${p}"
          done
          echo "All key versions present."
      - name: ⬆️ Upload sessionInfo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sessionInfo
          path: sessionInfo/*.txt
          if-no-files-found: error
      - name: 🐙 GitHub CR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🚀 Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r t; do
            [[ -n "${t}" ]] || continue
            docker push "${t}"
            echo "pushed ${t}" >> "${GITHUB_STEP_SUMMARY}"
          done <<< "${TAGS}"

      # Apptainer, for the HPC. Installed from the upstream .deb (checksum
      # pinned) rather than a setup action.
      - name: 📦 Apptainer setup
        env:
          APPTAINER_VERSION: 1.5.4
          APPTAINER_DEB_SHA256: 281cf9bd68f16b6f7c34a3a94d77668bc327b9c09db0412ce7890162734a97f7
        run: |
          set -euo pipefail
          deb="${RUNNER_TEMP}/apptainer_${APPTAINER_VERSION}_amd64.deb"
          curl -fsSL -o "${deb}" \
            "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_amd64.deb"
          echo "${APPTAINER_DEB_SHA256}  ${deb}" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq "${deb}"
          # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces
          # apptainer uses to run a .sif
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # /mnt is on the root disk on these runners, so the step above must leave enough room
          sudo mkdir -p /mnt/apptainer/tmp /mnt/apptainer/cache
          sudo chown -R "$(id -u):$(id -g)" /mnt/apptainer
          {
            echo "APPTAINER_TMPDIR=/mnt/apptainer/tmp"
            echo "APPTAINER_CACHEDIR=/mnt/apptainer/cache"
            echo "SIF=/mnt/apptainer/pdac-snrnaseq.sif"
          } >> "${GITHUB_ENV}"
          apptainer --version
          df -h / /mnt
      # Converted from the image just pushed, not from the local daemon: the daemon route
      # keeps several uncompressed copies of the image (~12 GB each) and fills the disk.
      # The daemon's copy is removed first; the registry layers are ~4 GB compressed.
      - name: 🕹️ Apptainer build + smoke test
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker system prune -af > /dev/null
          df -h /
          img="$(head -n 1 <<< "${TAGS}")"
          # Unprivileged builds print thousands of harmless "warn rootless{...} EPERM on
          # setxattr" lines: keep the full output in a log artifact, show the rest here
          log=/mnt/apptainer/apptainer-build.log
          if ! apptainer build "${SIF}" "docker://${img}" > "${log}" 2>&1; then
            tail -n 100 "${log}"; exit 1
          fi
          echo "$(grep -c 'warn rootless{' "${log}" || true) 'warn rootless{' lines hidden (see apptainer-build-log artifact)"
          grep -v 'warn rootless{' "${log}" | tail -n 30
          ls -lh "${SIF}"
          # Same checks as the Docker smoke test, on the read-only .sif
          apptainer run "${SIF}"
          if apptainer run "${SIF}" stage9; then
            echo "run.sh accepted an unknown stage" >&2; exit 1
          fi
          for env in snrnaseq downstream cellchat infercnv; do
            apptainer exec "${SIF}" cat "/pipeline/sessionInfo/${env}.txt" | cmp - "sessionInfo/${env}.txt"
          done
          echo "SIF matches the Docker image."
      - name: ⬆️ Upload Apptainer build log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apptainer-build-log
          path: /mnt/apptainer/apptainer-build.log
          if-no-files-found: ignore
      - name: 🚀 Apptainer push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | apptainer registry login -u "${GITHUB_ACTOR}" --password-stdin oras://ghcr.io
          while IFS= read -r t; do
            [[ -n "${t}" ]] || continue
            apptainer push "${SIF}" "oras://${t}-sif"
            echo "pushed oras://${t}-sif" >> "${GITHUB_STEP_SUMMARY}"
          done <<< "${TAGS}"
