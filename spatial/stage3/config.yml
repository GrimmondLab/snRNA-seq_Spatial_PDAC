# Container paths. Mount your data to these locations (see README.md and ../README.md).
# `parameters` are the values for each notebook's `parameters` cell; a notebook gets only those it has.
parameters:
  # Output of spatial Stage 1: one subfolder per sample, with <sample>.h5ad
  STAGE1_DIR: /output/spatial/stage1
  # Raw Xenium output (GEO GSE282154): one subfolder per sample, each with cell_feature_matrix.h5 and cells.csv
  RAW_DATA_DIR: /data/input/xenium_raw
  # Raw Xenium output of the four TNBC sections (GEO GSE281886): TNBC_1/ to TNBC_4/ (see ../README.md)
  TNBC_RAW_DIR: /data/input/xenium_raw_tnbc
  # The original subset and region objects, used only for checks; not deposited, so the checks are skipped
  ARCHIVED_DIR: null
  ARCHIVED_FILE: null
# Executed copies of the notebooks
executed_dir: /output/spatial/stage3/notebooks
# Run in this order: the TIL regions need the malignant-TIL output, and the TLS figures the TLS regions
notebooks:
  - name: stage3_malignant_TIL.ipynb
    parameters:
      OUTPUT_DIR: /output/spatial/stage3/malignant_TIL
  - name: stage3_tuft.ipynb
    parameters:
      OUTPUT_DIR: /output/spatial/stage3/tuft
      TUFT_INPUT_DIR: /pipeline/spatial/stage3/tuft_inputs   # included in the image
  - name: stage3_TIL_regions.ipynb
    parameters:
      MALIGNANT_DIR: /output/spatial/stage3/malignant_TIL
      OUTPUT_DIR: /output/spatial/stage3/TIL_regions
  - name: stage3_TLS_regions.ipynb
    parameters:
      OUTPUT_DIR: /output/spatial/stage3/TLS_regions
  - name: stage3_TLS_figures.ipynb
    parameters:
      REGION_DIR: /output/spatial/stage3/TLS_regions
  - name: stage3_MH097_PanIN.ipynb
    parameters:
      # Written by Stage 2 (stage2_niches.ipynb)
      STAGE2_COMBINED: /output/spatial/stage2/Combined_CLR_transform_global_CN_stage2.h5ad
      OUTPUT_DIR: /output/spatial/stage3/MH097_PanIN
